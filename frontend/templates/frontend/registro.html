{% extends "frontend/base.html" %}
{% block titulo %}Registro · Delivery App{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-7">
 <div class="card"><div class="card-body"><h1 class="h4">Crear cuenta</h1>
  <form id="formRegistro">
   <label for="usuario" class="form-label">Usuario</label>
   <input id="usuario" class="form-control mb-2" required>
   <label for="correo" class="form-label">Correo electrónico</label>
   <input id="correo" type="email" class="form-control mb-2" required>
   <label for="clave" class="form-label">Contraseña</label>
   <input id="clave" type="password" minlength="6" class="form-control mb-2" required>
   <label for="rol" class="form-label">Tipo de cuenta</label>
   <select id="rol" class="form-select mb-3">
    <option value="cliente">Cliente</option><option value="restaurante">Restaurante</option>
    <option value="repartidor">Repartidor</option>
   </select><button class="btn btn-primary" type="submit">Registrarme</button>
  </form><div id="resultado" role="status"></div>
 </div></div></div></div>
{% endblock %}
{% block scripts %}
<script>
const formRegistro = document.getElementById('formRegistro');
const usuario = document.getElementById('usuario');
const correo = document.getElementById('correo');
const clave = document.getElementById('clave');
const rol = document.getElementById('rol');
const resultado = document.getElementById('resultado');
formRegistro.addEventListener('submit', async e => {
 e.preventDefault();
 try {
   await Delivery.api('/api/auth/registro/', {method:'POST', body:JSON.stringify({
     username:usuario.value.trim(), email:correo.value.trim(), password:clave.value, rol:rol.value })});
   clave.value=''; Delivery.mostrar(resultado, 'Cuenta creada. Ingresa con tus credenciales.');
 } catch(error) {Delivery.mostrar(resultado,error.message,false);}
});
</script>
{% endblock %}
