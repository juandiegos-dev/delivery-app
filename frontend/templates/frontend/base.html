{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Delivery App{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">Delivery App</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menu">
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="/restaurantes/">Restaurantes</a>
          <a class="nav-link" href="/mis-pedidos/">Mis pedidos</a>
          <a class="nav-link" href="/panel-restaurante/">Restaurante</a>
          <a class="nav-link" href="/panel-repartidor/">Repartidor</a>
          <a class="nav-link" href="/ubicacion/">GPS</a>
        </div>
        <a class="btn btn-outline-light btn-sm me-2" href="/login/">Ingresar</a>
        <button class="btn btn-warning btn-sm" id="salir" type="button">Salir</button>
      </div>
    </div>
  </nav>
  <main class="container pb-5">
    <div id="avisoGlobal" role="status"></div>
    {% block contenido %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'frontend/js/api.js' %}"></script>
  <script>document.getElementById('salir').addEventListener('click', Delivery.salir);</script>
  {% block scripts %}{% endblock %}
</body>
</html>
